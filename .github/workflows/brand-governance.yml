name: BrandSphere AI Pre-Publication Governance CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  brand-governance-audit:
    name: Pre-Publication Brand Governance Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Automated Tests
        run: |
          python -m pytest backend/tests/ -v

      - name: Run Headless Brand Governance Scanner
        run: |
          python scripts/brandsphere-cli.py scan scripts/sample-collateral.md --strict
