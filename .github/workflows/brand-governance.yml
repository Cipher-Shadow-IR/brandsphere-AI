name: BrandSphere AI Enterprise Quality & Governance Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. BACKEND TEST & CODE QUALITY GATE
  # =========================================================================
  backend-gate:
    name: Backend Test Suite & Health Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install System Dependencies for Image & Document Processing
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt

      - name: Run Full Pytest Suite (All 34 Tests)
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./brand_governance_test.db
        run: |
          python -m pytest backend/tests/ -v --durations=10

      - name: Execute Headless Pre-Publication Brand Governance CLI (Strict Mode)
        env:
          PYTHONPATH: .
        run: |
          python scripts/brandsphere-cli.py scan scripts/sample-collateral.md --strict

  # =========================================================================
  # 2. FRONTEND TYPECHECK & PRODUCTION BUILD GATE
  # =========================================================================
  frontend-gate:
    name: Frontend TypeCheck & Next.js Production Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Strict TypeScript Verification (tsc --noEmit)
        run: npm run typecheck

      - name: Execute Production Webpack Build
        env:
          NEXT_PUBLIC_API_URL: https://brandsphere-backend-fwdc.onrender.com
        run: npm run build

  # =========================================================================
  # 3. DOCKER BUILD & ORCHESTRATION SANITY CHECK
  # =========================================================================
  docker-gate:
    name: Docker Multi-Stage Container Build Sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: brandsphere-api:test

      - name: Validate Docker Compose Configuration
        run: docker compose config
